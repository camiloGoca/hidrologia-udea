spring:
  application:
    name: hidrologia-udea-backend
  servlet:
    multipart:
      max-file-size: ${QUESTION_IMAGE_MAX_FILE_SIZE:5MB}
      max-request-size: ${QUESTION_IMAGE_MAX_REQUEST_SIZE:6MB}
  autoconfigure:
    exclude:
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

hidrologia:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    preview-origin-pattern: ${CORS_PREVIEW_ORIGIN_PATTERN:}
  cloudinary:
    enabled: ${CLOUDINARY_ENABLED:false}
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  firebase:
    enabled: ${FIREBASE_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:}
    admin-uid: ${FIREBASE_ADMIN_UID:}
  turnstile:
    enabled: ${TURNSTILE_ENABLED:false}
    secret-key: ${TURNSTILE_SECRET_KEY:}
    expected-hostnames: ${TURNSTILE_EXPECTED_HOSTNAMES:}
    expected-action: ${TURNSTILE_EXPECTED_ACTION:}
  uploads:
    images:
      max-size-bytes: ${QUESTION_IMAGE_MAX_BYTES:5242880}
      max-width: ${QUESTION_IMAGE_MAX_WIDTH:12000}
      max-height: ${QUESTION_IMAGE_MAX_HEIGHT:12000}
      max-pixels: ${QUESTION_IMAGE_MAX_PIXELS:60000000}
