name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        run: mvn -B test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: https://example.invalid/api/v1
      VITE_FIREBASE_API_KEY: ci-placeholder
      VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: ci-placeholder
      VITE_FIREBASE_APP_ID: ci-placeholder
      VITE_FIREBASE_MESSAGING_SENDER_ID: ci-placeholder
      VITE_TURNSTILE_SITE_KEY: ci-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run type-check

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Check frontend lint
        run: npm run lint:check

      - name: Build frontend
        run: npm run build

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HIDROLOGIA_UDEA }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_PROJECT_ID: ${{ vars.NORTHFLANK_PROJECT_ID }}
      NORTHFLANK_SERVICE_ID: ${{ vars.NORTHFLANK_SERVICE_ID }}

    steps:
      - name: Trigger and verify Northflank build
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GITHUB_SHA is not a full 40-character commit SHA."
            exit 1
          fi

          api_base="https://api.northflank.com/v1/projects/${NORTHFLANK_PROJECT_ID}/services/${NORTHFLANK_SERVICE_ID}"
          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT
          request_body="$(jq -nc --arg sha "${GITHUB_SHA}" '{sha: $sha}')"

          if ! http_status="$(curl -sS \
            -o "${response_file}" \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${NORTHFLANK_API_TOKEN}" \
            "${api_base}")"; then
            echo "Northflank service baseline request failed."
            exit 1
          fi

          if [[ "${http_status}" -lt 200 || "${http_status}" -ge 300 ]]; then
            echo "Northflank service baseline request failed with HTTP ${http_status}."
            exit 1
          fi

          baseline_deployment_transition="$(jq -r '.data.status.deployment.lastTransitionTime // empty' "${response_file}")"

          if [[ -z "${baseline_deployment_transition}" ]]; then
            echo "Northflank service baseline did not include deployment transition time."
            exit 1
          fi

          if ! http_status="$(curl -sS \
            -o "${response_file}" \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${NORTHFLANK_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${request_body}" \
            "${api_base}/build")"; then
            echo "Northflank build trigger request failed."
            exit 1
          fi

          if [[ "${http_status}" -lt 200 || "${http_status}" -ge 300 ]]; then
            echo "Northflank build trigger failed with HTTP ${http_status}."
            exit 1
          fi

          build_id="$(jq -r '.data.id // empty' "${response_file}")"
          build_sha="$(jq -r '.data.sha // empty' "${response_file}")"

          if [[ -z "${build_id}" ]]; then
            echo "Northflank build trigger did not return a build id."
            exit 1
          fi

          if [[ "${build_sha}" != "${GITHUB_SHA}" ]]; then
            echo "Northflank build SHA mismatch."
            exit 1
          fi

          echo "Northflank build started: ${build_id}"

          build_completed=false
          for attempt in {1..90}; do
            if ! http_status="$(curl -sS \
              -o "${response_file}" \
              -w "%{http_code}" \
              -H "Authorization: Bearer ${NORTHFLANK_API_TOKEN}" \
              "${api_base}/build/${build_id}")"; then
              echo "Northflank build status request failed."
              exit 1
            fi

            if [[ "${http_status}" -lt 200 || "${http_status}" -ge 300 ]]; then
              echo "Northflank build status request failed with HTTP ${http_status}."
              exit 1
            fi

            build_sha="$(jq -r '.data.sha // empty' "${response_file}")"
            build_status="$(jq -r '.data.status // "UNKNOWN"' "${response_file}")"
            build_concluded="$(jq -r '.data.concluded // false' "${response_file}")"
            build_success="$(jq -r '.data.success // false' "${response_file}")"

            if [[ "${build_sha}" != "${GITHUB_SHA}" ]]; then
              echo "Northflank build SHA mismatch while polling."
              exit 1
            fi

            echo "Northflank build status: ${build_status}"

            if [[ "${build_concluded}" == "true" ]]; then
              if [[ "${build_success}" == "true" ]]; then
                echo "Northflank build completed successfully."
                build_completed=true
                break
              fi

              echo "Northflank build concluded without success."
              exit 1
            fi

            sleep 10
          done

          if [[ "${build_completed}" != "true" ]]; then
            echo "Northflank build did not conclude within 15 minutes."
            exit 1
          fi

          deployment_transition_started=false
          for attempt in {1..90}; do
            if ! http_status="$(curl -sS \
              -o "${response_file}" \
              -w "%{http_code}" \
              -H "Authorization: Bearer ${NORTHFLANK_API_TOKEN}" \
              "${api_base}")"; then
              echo "Northflank deployment status request failed."
              exit 1
            fi

            if [[ "${http_status}" -lt 200 || "${http_status}" -ge 300 ]]; then
              echo "Northflank deployment status request failed with HTTP ${http_status}."
              exit 1
            fi

            deployment_status="$(jq -r '.data.status.deployment.status // "UNKNOWN"' "${response_file}")"
            deployment_transition="$(jq -r '.data.status.deployment.lastTransitionTime // empty' "${response_file}")"

            if [[ -n "${deployment_transition}" && "${deployment_transition}" != "${baseline_deployment_transition}" ]]; then
              deployment_transition_started=true
            fi

            echo "Northflank deployment status: ${deployment_status}"

            if [[ "${deployment_transition_started}" == "true" ]]; then
              if [[ "${deployment_status}" == "COMPLETED" ]]; then
                echo "Northflank deployment completed."
                exit 0
              fi

              if [[ "${deployment_status}" == "FAILED" ]]; then
                echo "Northflank deployment failed."
                exit 1
              fi
            fi

            sleep 10
          done

          echo "Northflank deployment did not complete within 15 minutes."
          exit 1
